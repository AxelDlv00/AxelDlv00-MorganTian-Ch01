name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lake-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Build with Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          build: true
          test: false
          lint: false
          # The hosted Mathlib artifact endpoint can fail before `lake build`
          # starts; the pinned toolchain can rebuild the dependency locally.
          use-mathlib-cache: false
          use-github-cache: false
